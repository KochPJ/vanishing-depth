# Gripper parameters
use_gripper: true

#gripper_state_source: "joint_states"
#gripper_state_topic_name: ""   # unused for joint_states
#gripper_joint_names: ["fr3_finger_joint1", "fr3_finger_joint2"]
gripper_state_source: "topic"
gripper_state_topic_name: "/robotiq_gripper/position"
gripper_joint_names: []   


gripper_min_width_m: 0.0
gripper_max_width_m: 0.08

gripper_command_mode: "trajectory"
gripper_single_command_idx: 10

# Inference execution parameters

camera_topic_name: "/robi1/rsd405/color/image_raw"
depth_cam_topic_name: "/robi1/rsd405/depth/image_raw"
base_rgb_topics:
  - "/robi1/cam_419122270994/color/image_raw"
  - "/robi1/rsd405/color/image_raw"      # legacy

base_depth_topics:
  - "/robi1/cam_419122270994/depth/image_raw"
  - "/robi1/rsd405/depth/image_raw"      # legacy

up_rgb_topics:
  - "/robi1/cam_260322271196/color/image_raw"

up_depth_topics:
  - "/robi1/cam_260322271196/depth/image_raw"
cam_time_max_ms: 500 # ms



joint_states_topic_name: "/joint_states"
anomaly_detection_topic_name: "/anomaly_detected"
marker_publisher_topic_name: "/rviz_visual_tools"
trajectory_publisher_topic_name: "/diffusion_policy/trajectory"
gripper_publisher_topic_name: "/diffusion_policy/gripper_position"

# bag-level split and eval settings
num_valid_bags: 0
num_test_bags: 0
eval_threshold_low: 0.2
eval_threshold_high: 0.8
seed: 42
overwrite_data: false
overwrite_image_data: false

# W&B  (optinal for results visualization on weights&biases)
wandb_enabled: false
wandb_project: "Gurke"
wandb_entity: "paul-koch"
wandb_run_name: "run-resnet-depth_new"
